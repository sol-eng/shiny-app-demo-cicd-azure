# Azure Pipelines — deploy a Shiny app to Posit Connect
#
# Auth: Connect API key. Create a variable group named "RSC" (Pipelines > Library) holding:
#   CONNECT_SERVER   base URL with a trailing slash, e.g. https://connect.example.com/
#   CONNECT_API_KEY  Connect API key, marked secret (never committed to the repo)
#
# This repository is the public, customer-facing example (Azure DevOps public projects are retired,
# so the public artifact lives on GitHub). Pipeline runs are validated in a private Azure DevOps
# project that builds against this repo.

trigger:
  - main

pool:
  vmImage: 'ubuntu-24.04'

# Azure Pipelines container jobs run as a NON-root user (and ignore
# `options: --user 0:0` on Microsoft-hosted agents), so this pipeline avoids
# apt/root: it installs packages from RSPM noble *binaries* into a writable
# user library and fetches a static jq. curl is already present in the image.
container: posit/r-base:4.5.1-noble

variables:
  - group: 'RSC'
  - name: CONTENT_DIRECTORY
    value: app
  - name: UNIQ_NAME
    value: shiny-app-demo-cicd-azure

steps:
  - task: Bash@3
    displayName: 'Build, test, and deploy to Connect'
    inputs:
      targetType: inline
      script: |
        set -euo pipefail
        export R_LIBS_USER="$PWD/.rlib"; mkdir -p "$R_LIBS_USER"
        export PATH="$PWD/.bin:$PATH"; mkdir -p "$PWD/.bin"
        # static jq (no root / no apt-get)
        curl -fsSL -o "$PWD/.bin/jq" https://github.com/jqlang/jq/releases/download/jq-1.7.1/jq-linux-amd64
        chmod +x "$PWD/.bin/jq"
        # Disable renv auto-activation: the repo's .Rprofile sources renv, which
        # would hijack install.packages and stage into the (non-writable) system
        # library. Removing it sends installs to R_LIBS_USER.
        rm -f .Rprofile
        # RSPM __linux__/noble serves prebuilt binaries -> no compilation, no -dev headers
        Rscript -e '.libPaths(Sys.getenv("R_LIBS_USER")); options(repos=c(CRAN="https://packagemanager.posit.co/cran/__linux__/noble/latest")); install.packages(c("shiny","jsonlite","ggplot2","stringr","DT","rsconnect"))'
        Rscript -e '.libPaths(Sys.getenv("R_LIBS_USER")); rsconnect::writeManifest(Sys.getenv("CONTENT_DIRECTORY"))'
        chmod +x ./deploy-to-connect.sh
        /bin/bash deploy-to-connect.sh
    env:
      CONNECT_SERVER: $(CONNECT_SERVER)
      CONNECT_API_KEY: $(CONNECT_API_KEY)
      CONTENT_DIRECTORY: $(CONTENT_DIRECTORY)
      UNIQ_NAME: $(UNIQ_NAME)
